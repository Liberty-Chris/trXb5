<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="35" y="33.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ROACH  /  NFC WRITER</text><text x="35" y="67.2" font-family="Arial,sans-serif" font-size="24" fill="#16334a">Reader, host connector and power connections</text><text x="35" y="90.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">U101 pin numbers below use ST25R3916B QFN32, DS13541 Rev 11 Table 2. Do not substitute ST25R3917B.</text><line x1="35" y1="108" x2="1165" y2="108" stroke="#16768d" stroke-width="1.2"/><text x="35" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#996000">REV A0  |  ENGINEERING TARGET  |  NOT FOR FABRICATION  |  04 NOV 2026</text><text x="1050" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">SHEET 2 OF 6</text><text x="35" y="782.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Concept target only. Not a complete netlist. Direct and PA links are mutually exclusive. See START_HERE.md before KiCad implementation.</text><line x1="40" y1="140" x2="380" y2="140" stroke="#16768d" stroke-width="1.2"/><line x1="380" y1="140" x2="380" y2="315" stroke="#16768d" stroke-width="1.2"/><line x1="380" y1="315" x2="40" y2="315" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="315" x2="40" y2="140" stroke="#16768d" stroke-width="1.2"/><text x="50" y="159.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">J101  2 x 10 HOST HEADER</text><text x="50" y="180.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">1 GND        2 +3V3_IO input</text><text x="50" y="197.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">3 SPI_SCLK   4 SPI_MOSI</text><text x="50" y="214.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">5 SPI_MISO   6 NFC_BSS_N</text><text x="50" y="231.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">7 NFC_IRQ    8 RF_PERMIT</text><text x="50" y="248.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">9 ANT_REQ0  10 ANT_REQ1</text><text x="50" y="265.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">11 ANT_REQ2 12 ANT_REQ3</text><text x="50" y="282.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">13 ANT_REQ4 14 PA_ENABLE_REQUEST</text><text x="50" y="333.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">15 PA_LEVEL_CTL  16 FAULT_N  17..20 GND</text><line x1="425" y1="140" x2="765" y2="140" stroke="#16768d" stroke-width="1.2"/><line x1="765" y1="140" x2="765" y2="335" stroke="#16768d" stroke-width="1.2"/><line x1="765" y1="335" x2="425" y2="335" stroke="#16768d" stroke-width="1.2"/><line x1="425" y1="335" x2="425" y2="140" stroke="#16768d" stroke-width="1.2"/><text x="435" y="159.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">U101 DIGITAL CONNECTIONS</text><text x="435" y="180.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">1 VDD_IO -&gt; +3V3_IO</text><text x="435" y="197.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">29 BSS -&gt; NFC_BSS_N; 10k pullup to I/O rail</text><text x="435" y="214.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">30 SCLK &lt;- SPI_SCLK; 31 MOSI &lt;- SPI_MOSI</text><text x="435" y="231.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">32 MISO -&gt; SPI_MISO; 27 IRQ -&gt; NFC_IRQ</text><text x="435" y="248.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">20 I2C_EN -&gt; GND for SPI mode</text><text x="435" y="265.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">4 XTO -- Y101 27.12 MHz -- 5 XTI</text><text x="435" y="282.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Crystal load caps C111/C112: derive from CL.</text><text x="435" y="299.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">2 TAD1 / 25 TAD2 / 28 MCU_CLK: test pads</text><line x1="815" y1="140" x2="1160" y2="140" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="140" x2="1160" y2="335" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="335" x2="815" y2="335" stroke="#16768d" stroke-width="1.2"/><line x1="815" y1="335" x2="815" y2="140" stroke="#16768d" stroke-width="1.2"/><text x="825" y="159.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">U101 POWER CONNECTIONS</text><text x="825" y="180.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">8 VDD and 10 VDD_TX -&gt; +5V_NFC</text><text x="825" y="197.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">9 VDD_RF -&gt; 14 VDD_DR, per reference</text><text x="825" y="214.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">3 VDD_D and 7 VDD_A: regulator outputs</text><text x="825" y="231.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Do not tie internal regulator outputs to 3.3 V.</text><text x="825" y="248.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">11 VDD_AM: mode specific capacitor network</text><text x="825" y="265.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">24 AGDC: 1 uF || 10 nF to GND</text><text x="825" y="282.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">6,12,16,21,26 and pad 33 -&gt; GND</text><text x="825" y="299.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">17 EXT_LM: unused in reader only topology</text><line x1="40" y1="395" x2="280" y2="395" stroke="#16768d" stroke-width="1.2"/><line x1="280" y1="395" x2="280" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="280" y1="485" x2="40" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="485" x2="40" y2="395" stroke="#16768d" stroke-width="1.2"/><text x="50" y="414.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">J102  +5 V INPUT</text><text x="50" y="435.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">External regulated bench supply</text><text x="50" y="452.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">No PA supply assumption</text><line x1="330" y1="395" x2="590" y2="395" stroke="#16768d" stroke-width="1.2"/><line x1="590" y1="395" x2="590" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="590" y1="485" x2="330" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="330" y1="485" x2="330" y2="395" stroke="#16768d" stroke-width="1.2"/><text x="340" y="414.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">F101 / U102 PROTECTION</text><text x="340" y="435.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Fuse + reverse input protection</text><text x="340" y="452.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Current limit parts: select later</text><line x1="640" y1="395" x2="860" y2="395" stroke="#16768d" stroke-width="1.2"/><line x1="860" y1="395" x2="860" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="860" y1="485" x2="640" y2="485" stroke="#16768d" stroke-width="1.2"/><line x1="640" y1="485" x2="640" y2="395" stroke="#16768d" stroke-width="1.2"/><text x="650" y="414.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">+5V_NFC</text><text x="650" y="435.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Local bulk + HF bypass</text><text x="650" y="452.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Filter based on current budget</text><line x1="280" y1="440" x2="330" y2="440" stroke="#16334a" stroke-width="1.2"/><line x1="590" y1="440" x2="640" y2="440" stroke="#16334a" stroke-width="1.2"/><line x1="40" y1="535" x2="1160" y2="535" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="535" x2="1160" y2="695" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="695" x2="40" y2="695" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="695" x2="40" y2="535" stroke="#16768d" stroke-width="1.2"/><text x="50" y="554.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">DECOUPLING AND POWER INTEGRITY</text><text x="50" y="575.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">C101/C102 at VDD: 2.2 uF and 10 nF initial target; repeat at VDD_TX and VDD_IO as appropriate.</text><text x="50" y="592.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">C107/C108 at VDD_D, C109/C110 at VDD_A and C113/C114 at VDD_RF: 2.2 uF || 10 nF.</text><text x="50" y="609.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">VDD_AM capacitor depends on regulator AM versus AWS AM. Follow DS13541 Figure 1 and configuration.</text><text x="50" y="626.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">18 AAT_A and 19 AAT_B: test pads only. No automatic coax panel tuning is implemented in A0.</text><text x="50" y="643.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">RF_PERMIT and PA_ENABLE_REQUEST require pulldowns. Missing I/O rail or host reset must disable RF.</text><text x="50" y="660.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">This sheet specifies net intent. Desktop designer must complete protection, bypass placement and connector ESD.</text></svg>