<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="35" y="33.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ROACH  /  NFC WRITER</text><text x="35" y="67.2" font-family="Arial,sans-serif" font-size="24" fill="#16334a">RF drive, amplifier boundary and receive feedback</text><text x="35" y="90.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">The direct path is the bringup baseline. A PA must preserve both outgoing modulation and incoming load modulation.</text><line x1="35" y1="108" x2="1165" y2="108" stroke="#16768d" stroke-width="1.2"/><text x="35" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#996000">REV A0  |  ENGINEERING TARGET  |  NOT FOR FABRICATION  |  04 NOV 2026</text><text x="1050" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">SHEET 3 OF 6</text><text x="35" y="782.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Concept target only. Not a complete netlist. Direct and PA links are mutually exclusive. See START_HERE.md before KiCad implementation.</text><line x1="40" y1="155" x2="200" y2="155" stroke="#16768d" stroke-width="1.2"/><line x1="200" y1="155" x2="200" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="200" y1="265" x2="40" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="265" x2="40" y2="155" stroke="#16768d" stroke-width="1.2"/><text x="50" y="174.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">U101 RF PINS</text><text x="50" y="195.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">13 RFO1 -&gt; TX</text><text x="50" y="212.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">22 RFI1 &lt;- RX</text><text x="50" y="229.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">15 RFO2 unused</text><text x="50" y="246.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">23 RFI2 configure</text><line x1="250" y1="155" x2="485" y2="155" stroke="#16768d" stroke-width="1.2"/><line x1="485" y1="155" x2="485" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="485" y1="265" x2="250" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="250" y1="265" x2="250" y2="155" stroke="#16768d" stroke-width="1.2"/><text x="260" y="174.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">Z201 DIRECT MATCH</text><text x="260" y="195.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">EMC filter + impedance match</text><text x="260" y="212.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Single ended cable topology</text><text x="260" y="229.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Calculate from AN5592</text><text x="260" y="246.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Values TBD, not copied examples</text><line x1="550" y1="155" x2="770" y2="155" stroke="#16768d" stroke-width="1.2"/><line x1="770" y1="155" x2="770" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="770" y1="265" x2="550" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="550" y1="265" x2="550" y2="155" stroke="#16768d" stroke-width="1.2"/><text x="560" y="174.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">P201 MANUAL LINK</text><text x="560" y="195.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Direct path selection</text><text x="560" y="212.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">RF off before changing links</text><text x="560" y="229.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Populate one path only</text><line x1="850" y1="155" x2="1150" y2="155" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="155" x2="1150" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="265" x2="850" y2="265" stroke="#16768d" stroke-width="1.2"/><line x1="850" y1="265" x2="850" y2="155" stroke="#16768d" stroke-width="1.2"/><text x="860" y="174.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">RF_BUS_50</text><text x="860" y="195.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Nominal 50 ohm interface</text><text x="860" y="212.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">To selector on sheet 4</text><text x="860" y="229.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">TP201 RF sampling footprint</text><line x1="200" y1="185" x2="250" y2="185" stroke="#16334a" stroke-width="1.2"/><line x1="485" y1="185" x2="550" y2="185" stroke="#16334a" stroke-width="1.2"/><line x1="770" y1="185" x2="850" y2="185" stroke="#16334a" stroke-width="1.2"/><line x1="250" y1="340" x2="770" y2="340" stroke="#16768d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="770" y1="340" x2="770" y2="465" stroke="#16768d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="770" y1="465" x2="250" y2="465" stroke="#16768d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="250" y1="465" x2="250" y2="340" stroke="#16768d" stroke-width="1.2" stroke-dasharray="4 3"/><text x="260" y="359.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">A201 OPTIONAL PA DEVELOPMENT CIRCUIT</text><text x="260" y="380.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Input conditioning -&gt; controlled RF power stage -&gt; output filter / match</text><text x="260" y="397.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">PA input/output impedance and gain: TBD after modulation tests</text><text x="260" y="414.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Separate current limited PA supply. Default PA disabled.</text><text x="260" y="431.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Do not use a generic RF gain block without NFC envelope validation.</text><line x1="220" y1="185" x2="220" y2="385" stroke="#16334a" stroke-width="1.2"/><line x1="220" y1="385" x2="250" y2="385" stroke="#16334a" stroke-width="1.2"