th="1.2"/><text x="50" y="669.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">RF VALIDATION HOLD</text><text x="50" y="690.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">No fixed PA gain, wattage, divider values or protection diode is approved. Check ASK shape, receiver recovery, sidebands and RFI limits.</text></svg>