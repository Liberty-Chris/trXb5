<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="35" y="33.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ROACH  /  NFC WRITER</text><text x="35" y="67.2" font-family="Arial,sans-serif" font-size="24" fill="#16334a">System target and implementation boundaries</text><text x="35" y="90.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">Five selectable loop antennas. One local primary plus four SMA connected panels. 13.56 MHz inductive reader.</text><line x1="35" y1="108" x2="1165" y2="108" stroke="#16768d" stroke-width="1.2"/><text x="35" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#996000">REV A0  |  ENGINEERING TARGET  |  NOT FOR FABRICATION  |  04 NOV 2026</text><text x="1050" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">SHEET 1 OF 6</text><text x="35" y="782.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Concept target only. Not a complete netlist. Direct and PA links are mutually exclusive. See START_HERE.md before KiCad implementation.</text><line x1="40" y1="150" x2="240" y2="150" stroke="#16768d" stroke-width="1.2"/><line x1="240" y1="150" x2="240" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="240" y1="250" x2="40" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="250" x2="40" y2="150" stroke="#16768d" stroke-width="1.2"/><text x="50" y="169.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">J101 HOST INTERFACE</text><text x="50" y="190.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">3.3 V SPI + IRQ</text><text x="50" y="207.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Five antenna requests</text><text x="50" y="224.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">RF permit + PA control</text><line x1="290" y1="150" x2="520" y2="150" stroke="#16768d" stroke-width="1.2"/><line x1="520" y1="150" x2="520" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="520" y1="250" x2="290" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="290" y1="250" x2="290" y2="150" stroke="#16768d" stroke-width="1.2"/><text x="300" y="169.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">U101 ST25R3916B</text><text x="300" y="190.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Candidate reader, QFN32</text><text x="300" y="207.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">27.12 MHz crystal</text><text x="300" y="224.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">5 V supply / 3.3 V I/O</text><line x1="570" y1="150" x2="800" y2="150" stroke="#16768d" stroke-width="1.2"/><line x1="800" y1="150" x2="800" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="800" y1="250" x2="570" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="570" y1="250" x2="570" y2="150" stroke="#16768d" stroke-width="1.2"/><text x="580" y="169.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">RF CONDITIONING</text><text x="580" y="190.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Matched direct reader path</text><text x="580" y="207.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Optional PA development path</text><text x="580" y="224.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Protected receive feedback</text><line x1="850" y1="150" x2="1150" y2="150" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="150" x2="1150" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="250" x2="850" y2="250" stroke="#16768d" stroke-width="1.2"/><line x1="850" y1="250" x2="850" y2="150" stroke="#16768d" stroke-width="1.2"/><text x="860" y="169.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ANTENNA SELECTOR</text><text x="860" y="190.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Five SPDT RF relay channels</text><text x="860" y="207.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Only one energized at a time</text><text x="860" y="224.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Unselected ports terminated</text><line x1="240" y1="200" x2="290" y2="200" stroke="#16334a" stroke-width="1.2"/><line x1="520" y1="200" x2="570" y2="200" stroke="#16334a" stroke-width="1.2"/><line x1="800" y1="200" x2="850" y2="200" stroke="#16334a" stroke-width="1.2"/><line x1="850" y1="315" x2="1150" y2="315" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="315" x2="1150" y2="410" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="410" x2="850" y2="410" stroke="#16768d" stroke-width="1.2"/><line x1="850" y1="410" x2="850" y2="315" stroke="#16768d" stroke-width="1.2"/><text x="860" y="334.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ANT0 PRIMARY</text><text x="860" y="355.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Local 150 x 150 mm loop</text><text x="860" y="372.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Disconnect link and own match</text><line x1="850" y1="450" x2="1150" y2="450" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="450" x2="1150" y2="545" stroke="#16768d" stroke-width="1.2"/><line x1="1150" y1="545" x2="850" y2="545" stroke="#16768d" stroke-width="1.2"/><line x1="850" y1="545" x2="850" y2="450" stroke="#16768d" stroke-width="1.2"/><text x="860" y="469.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ANT1 THROUGH ANT4</text><text x="860" y="490.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Four 150 x 150 mm panels</text><text x="860" y="507.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">50 ohm SMA coax assemblies</text><line x1="1000" y1="250" x2="1000" y2="315" stroke="#16334a" stroke-width="1.2"/><line x1="1140" y1="250" x2="1170" y2="250" stroke="#16334a" stroke-width="1.2"/><line x1="1170" y1="250" x2="1170" y2="495" stroke="#16334a" stroke-width="1.2"/><line x1="1170" y1="495" x2="1150" y2="495" stroke="#16334a" stroke-width="1.2"/><line x1="40" y1="310" x2="755" y2="310" stroke="#16768d" stroke-width="1.2"/><line x1="755" y1="310" x2="755" y2="430" stroke="#16768d" stroke-width="1.2"/><line x1="755" y1="430" x2="40" y2="430" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="430" x2="40" y2="310" stroke="#16768d" stroke-width="1.2"/><text x="50" y="329.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">WORKING REQUIREMENTS</text><text x="50" y="350.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Metal cavity: 457 x 457 x 457 mm approximately. Product position may vary.</text><text x="50" y="367.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Maximum desired antenna to label distance: 305 mm. Achievement is unproven.</text><text x="50" y="384.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Current label: Santek EZ Sign 2.9 inch four color, nominal SE0290C1.</text><text x="50" y="401.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Read identity, transfer image, complete refresh, verify response and visible image.</text><line x1="40" y1="475" x2="755" y2="475" stroke="#16768d" stroke-width="1.2"/><line x1="755" y1="475" x2="755" y2="680" stroke="#16768d" stroke-width="1.2"/><line x1="755" y1="680" x2="40" y2="680" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="680" x2="40" y2="475" stroke="#16768d" stroke-width="1.2"/><text x="50" y="494.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">RELEASE GATES</text><text x="50" y="515.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G1  Confirm actual NFC type, command sequence and successful label refresh.</text><text x="50" y="532.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G2  Demonstrate the direct reader path with one panel before adding a PA.</text><text x="50" y="549.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G3  Select PA architecture preserving ASK and label load modulation feedback.</text><text x="50" y="566.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G4  Rate relays, matching parts and connectors for measured voltage/current.</text><text x="50" y="583.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G5  Tune all paths in the machine. Measure inactive panel coupling and heating.</text><text x="50" y="600.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">G6  Map full refresh success throughout the required product trajectory.</text><text x="50" y="617.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">An amplifier topology, PA output power and range are intentionally not asserted.</text></svg>