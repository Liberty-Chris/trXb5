<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="35" y="33.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">ROACH  /  NFC WRITER</text><text x="35" y="67.2" font-family="Arial,sans-serif" font-size="24" fill="#16334a">Loop panel circuit and tuning provisions</text><text x="35" y="90.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">ANT0 through ANT4 use the same target circuit. All matching and damping values are measured design outputs.</text><line x1="35" y1="108" x2="1165" y2="108" stroke="#16768d" stroke-width="1.2"/><text x="35" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#996000">REV A0  |  ENGINEERING TARGET  |  NOT FOR FABRICATION  |  04 NOV 2026</text><text x="1050" y="759.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">SHEET 5 OF 6</text><text x="35" y="782.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Concept target only. Not a complete netlist. Direct and PA links are mutually exclusive. See START_HERE.md before KiCad implementation.</text><text x="45" y="164.6" font-family="Arial,sans-serif" font-size="12" fill="#16334a">J401 SMA</text><text x="45" y="183.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Center</text><line x1="100" y1="205" x2="210" y2="205" stroke="#16334a" stroke-width="1.2"/><line x1="210" y1="205" x2="227" y2="205" stroke="#16334a" stroke-width="1.2"/><line x1="227" y1="195" x2="227" y2="215" stroke="#16334a" stroke-width="1.2"/><line x1="233" y1="195" x2="233" y2="215" stroke="#16334a" stroke-width="1.2"/><line x1="233" y1="205" x2="250" y2="205" stroke="#16334a" stroke-width="1.2"/><text x="210" y="178.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">CS401</text><text x="210" y="191.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">C0G / select</text><line x1="250" y1="205" x2="470" y2="205" stroke="#16334a" stroke-width="1.2"/><circle cx="175" cy="205" r="2.5" fill="#16334a"/><line x1="175" y1="205" x2="175" y2="350" stroke="#16334a" stroke-width="1.2"/><line x1="175" y1="350" x2="175" y2="367" stroke="#16334a" stroke-width="1.2"/><line x1="165" y1="367" x2="185" y2="367" stroke="#16334a" stroke-width="1.2"/><line x1="165" y1="373" x2="185" y2="373" stroke="#16334a" stroke-width="1.2"/><line x1="175" y1="373" x2="175" y2="390" stroke="#16334a" stroke-width="1.2"/><text x="190" y="365.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">CP401</text><text x="190" y="379.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">C0G / select</text><line x1="175" y1="390" x2="175" y2="430" stroke="#16334a" stroke-width="1.2"/><line x1="175" y1="430" x2="175" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="165" y1="439" x2="185" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="169" y1="443" x2="181" y2="443" stroke="#16334a" stroke-width="1.2"/><line x1="173" y1="447" x2="177" y2="447" stroke="#16334a" stroke-width="1.2"/><line x1="200" y1="205" x2="200" y2="285" stroke="#16334a" stroke-width="1.2"/><line x1="200" y1="285" x2="217" y2="285" stroke="#16334a" stroke-width="1.2"/><line x1="217" y1="275" x2="217" y2="295" stroke="#16334a" stroke-width="1.2"/><line x1="223" y1="275" x2="223" y2="295" stroke="#16334a" stroke-width="1.2"/><line x1="223" y1="285" x2="240" y2="285" stroke="#16334a" stroke-width="1.2"/><text x="200" y="258.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">CT401</text><text x="200" y="271.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">RF trimmer</text><line x1="240" y1="285" x2="310" y2="285" stroke="#16334a" stroke-width="1.2"/><line x1="310" y1="285" x2="310" y2="205" stroke="#16334a" stroke-width="1.2"/><circle cx="310" cy="205" r="2.5" fill="#16334a"/><line x1="175" y1="325" x2="105" y2="325" stroke="#16334a" stroke-width="1.2"/><line x1="105" y1="350" x2="105" y2="367" stroke="#16334a" stroke-width="1.2"/><line x1="95" y1="367" x2="115" y2="367" stroke="#16334a" stroke-width="1.2"/><line x1="95" y1="373" x2="115" y2="373" stroke="#16334a" stroke-width="1.2"/><line x1="105" y1="373" x2="105" y2="390" stroke="#16334a" stroke-width="1.2"/><text x="120" y="365.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">CT402</text><text x="120" y="379.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Optional trim</text><line x1="105" y1="325" x2="105" y2="350" stroke="#16334a" stroke-width="1.2"/><line x1="105" y1="390" x2="105" y2="430" stroke="#16334a" stroke-width="1.2"/><line x1="105" y1="430" x2="105" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="95" y1="439" x2="115" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="99" y1="443" x2="111" y2="443" stroke="#16334a" stroke-width="1.2"/><line x1="103" y1="447" x2="107" y2="447" stroke="#16334a" stroke-width="1.2"/><line x1="470" y1="205" x2="480" y2="205" stroke="#16334a" stroke-width="1.2"/><line x1="480" y1="198" x2="510" y2="198" stroke="#16334a" stroke-width="1.2"/><line x1="510" y1="198" x2="510" y2="212" stroke="#16334a" stroke-width="1.2"/><line x1="510" y1="212" x2="480" y2="212" stroke="#16334a" stroke-width="1.2"/><line x1="480" y1="212" x2="480" y2="198" stroke="#16334a" stroke-width="1.2"/><line x1="510" y1="205" x2="520" y2="205" stroke="#16334a" stroke-width="1.2"/><text x="468" y="179.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">RQ401</text><text x="468" y="192.2" font-family="Arial,sans-serif" font-size="9" fill="#16334a">Select / Q damping</text><line x1="520" y1="205" x2="620" y2="205" stroke="#16334a" stroke-width="1.2"/><line x1="620" y1="170" x2="840" y2="170" stroke="#16768d" stroke-width="1.2"/><line x1="840" y1="170" x2="840" y2="270" stroke="#16768d" stroke-width="1.2"/><line x1="840" y1="270" x2="620" y2="270" stroke="#16768d" stroke-width="1.2"/><line x1="620" y1="270" x2="620" y2="170" stroke="#16768d" stroke-width="1.2"/><text x="630" y="189.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">L401 PCB LOOP</text><text x="630" y="210.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">150 x 150 mm outline target</text><text x="630" y="227.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Turns / trace / spacing TBD</text><text x="630" y="244.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Measure L, R and self resonance</text><line x1="840" y1="220" x2="890" y2="220" stroke="#16334a" stroke-width="1.2"/><line x1="890" y1="220" x2="890" y2="430" stroke="#16334a" stroke-width="1.2"/><line x1="890" y1="430" x2="890" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="880" y1="439" x2="900" y2="439" stroke="#16334a" stroke-width="1.2"/><line x1="884" y1="443" x2="896" y2="443" stroke="#16334a" stroke-width="1.2"/><line x1="888" y1="447" x2="892" y2="447" stroke="#16334a" stroke-width="1.2"/><text x="390" y="323.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">CS401 || CT401 = adjustable series capacitance</text><text x="390" y="350.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">CP401 || CT402 = adjustable shunt capacitance</text><text x="390" y="377.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">RQ401 controls loaded Q; use fixed RF rated resistor.</text><text x="390" y="404.8" font-family="Arial,sans-serif" font-size="11" fill="#16334a">SMA shell and loop return share RF ground.</text><line x1="40" y1="490" x2="570" y2="490" stroke="#16768d" stroke-width="1.2"/><line x1="570" y1="490" x2="570" y2="690" stroke="#16768d" stroke-width="1.2"/><line x1="570" y1="690" x2="40" y2="690" stroke="#16768d" stroke-width="1.2"/><line x1="40" y1="690" x2="40" y2="490" stroke="#16768d" stroke-width="1.2"/><text x="50" y="509.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">PANEL IMPLEMENTATION</text><text x="50" y="530.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Provide solder selectable capacitor footprints for coarse tuning.</text><text x="50" y="547.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Use RF trimmers for fine adjustment, within measured RF ratings.</text><text x="50" y="564.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">No resistor pot in the resonant loop. No ground pour under loop.</text><text x="50" y="581.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Keep metal mounting hardware outside the active loop area.</text><text x="50" y="598.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Ferrite backing and wall clearance are part of the tuned assembly.</text><text x="50" y="615.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Terminate unused panels through selector sheet 4.</text><text x="50" y="632.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Fit TP401/TP402 for disconnected impedance measurement.</text><text x="50" y="649.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Baseline cable lengths: characterize 0.3 m / 0.6 m / 1.0 m.</text><line x1="610" y1="490" x2="1160" y2="490" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="490" x2="1160" y2="690" stroke="#16768d" stroke-width="1.2"/><line x1="1160" y1="690" x2="610" y2="690" stroke="#16768d" stroke-width="1.2"/><line x1="610" y1="690" x2="610" y2="490" stroke="#16768d" stroke-width="1.2"/><text x="620" y="509.6" font-family="Arial,sans-serif" font-size="12" fill="#16768d">MEASURE BEFORE ASSIGNING VALUES</text><text x="620" y="530.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">150 x 150 mm is a prototype size, not a range guarantee.</text><text x="620" y="547.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Match the assembled panel to nominal 50 ohms at 13.56 MHz.</text><text x="620" y="564.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Include cable, connector, relay parasitics, ferrite and cavity walls.</text><text x="620" y="581.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Good return loss alone does not establish NFC field performance.</text><text x="620" y="598.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Verify bandwidth preserves modulation and tag response sidebands.</text><text x="620" y="615.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">Capacitor voltage and resistor power ratings follow measured stress.</text><text x="620" y="632.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">AN5592 section 2.4 does not provide AAT for its coax topology.</text><text x="620" y="649.0" font-family="Arial,sans-serif" font-size="10" fill="#16334a">A0 therefore uses manual panel tuning only.</text></svg>